name: Feature request
description: Propose a new feature or extension to an existing one.
title: "feat(area): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Before filing, please check
        the README's "Status" section to confirm it isn't already in
        progress or explicitly out of scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Concrete user story preferred.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would the feature work? Sketch the API surface or syntax if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this and why they're worse.

  - type: textarea
    id: example
    attributes:
      label: Example
      description: Sample `.mbtv` showing how the feature would be used.
      render: html

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - compiler
        - runtime
        - LSP / tooling
        - CLI
        - editor integration
        - documentation
        - CI / release
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Self-check
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I confirmed this isn't already listed under "intentionally excluded" in the README.
          required: true
