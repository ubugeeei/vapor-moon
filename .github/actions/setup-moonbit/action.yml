name: Setup MoonBit
description: Install the MoonBit toolchain and repository MoonBit dependencies.

inputs:
  version:
    description: MoonBit installer version argument.
    required: false
    default: 0.1.20260512
  update-dependencies:
    description: Run moon update before installing dependencies. Keep false for reproducible verification.
    required: false
    default: "false"
  patch-mooncakes:
    description: Reapply the repository mooncakes patch after dependency install.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install MoonBit CLI
      shell: bash
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ inputs.version }}"
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: Show MoonBit version
      shell: bash
      run: |
        set -euo pipefail
        moon version
        actual_version="$(moon version | sed -n 's/^moon \([^ ]*\).*/\1/p')"
        if [[ "${{ inputs.version }}" != "latest" && "$actual_version" != "${{ inputs.version }}" ]]; then
          echo "Expected MoonBit ${{ inputs.version }}, got $actual_version" >&2
          exit 1
        fi

    - name: Update MoonBit dependencies
      if: ${{ inputs.update-dependencies == 'true' }}
      shell: bash
      run: moon update

    - name: Install MoonBit dependencies
      shell: bash
      run: moon install

    - name: Patch Mooncakes
      if: ${{ inputs.patch-mooncakes == 'true' }}
      shell: bash
      run: bash scripts/patch_mooncakes.sh
