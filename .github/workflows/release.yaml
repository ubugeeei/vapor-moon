name: Release Verify

on:
  workflow_dispatch:
    inputs:
      update_moonbit_dependencies:
        description: Run moon update before installing dependencies for an intentional registry refresh.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MOONBIT_VERSION: 0.1.20260512
  UPDATE_MOONBIT_DEPENDENCIES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_moonbit_dependencies == true }}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOONBIT_VERSION }}
          update-dependencies: ${{ env.UPDATE_MOONBIT_DEPENDENCIES }}
      - name: Moon check
        run: moon check --deny-warn --warn-list -deprecated_syntax-deprecated --target native 2> >(grep -v 'WARN Duplicate alias' >&2)
      - name: Moon native smoke tests
        run: |
          moon test --target native src/cmd/vapor_moon
          moon test --target native src/runtime
      - name: CLI smoke test
        run: bash scripts/smoke_cli.sh
      - name: Package contents
        run: moon package --list
      - name: Publish dry run
        run: bash scripts/verify_publish_dry_run.sh
