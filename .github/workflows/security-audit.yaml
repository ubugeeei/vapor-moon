name: Security audit

on:
  schedule:
    # Weekly on Tuesday 04:00 JST (Monday 19:00 UTC) so Dependabot's
    # Monday batch has already opened any urgent PRs.
    - cron: "0 19 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "editors/vscode/package*.json"
      - "editors/zed/Cargo.*"
      - "e2e/package*.json"
      - "e2e/pnpm-lock.yaml"

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: "10"
      - name: pnpm audit (e2e)
        working-directory: e2e
        # `--prod` because dev-only advisories (testing libs) are noisy
        # and don't ship to users.
        run: pnpm audit --prod --audit-level=high

  npm-audit-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: npm audit (editors/vscode)
        working-directory: editors/vscode
        run: npm audit --audit-level=high

  cargo-audit-zed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit (editors/zed)
        working-directory: editors/zed
        run: cargo audit --deny warnings
