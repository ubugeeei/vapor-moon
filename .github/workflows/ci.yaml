name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_VERSION: latest
  MOONBIT_EXPECTED_VERSION: "0.1.20260512"
  # SHA-256 is pinned per host. These top-level values are the Linux
  # (linux-x86_64) sums used by the non-matrix jobs (check-js, e2e,
  # release). The matrix `check-native-matrix` job below overrides them
  # per-OS so macOS gets its own pin too. To bump these on a future
  # toolchain version, re-run CI once with empty values and read the
  # SHA-256 the setup-moonbit action prints as a workflow notice.
  MOONBIT_ARCHIVE_SHA256: "2c3a5af2020c9ceb3fe11e6457e647a215846d97d71c8e784b3d0a7c8cfc606b"
  MOONBIT_CORE_SHA256: "c68ba56201bd8d99db442b6df599c2c217b0528edec7d6de6e871b6e589c502e"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-native-matrix:
    name: check-native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive-sha256: "2c3a5af2020c9ceb3fe11e6457e647a215846d97d71c8e784b3d0a7c8cfc606b"
            core-sha256: "c68ba56201bd8d99db442b6df599c2c217b0528edec7d6de6e871b6e589c502e"
          - os: macos-latest
            # macOS uses a different platform archive but the same
            # bundled core. Both are sourced from the workflow notices
            # printed by the setup-moonbit action — see CONTRIBUTING.md
            # "Pinning a new CI platform" for the rotation procedure.
            archive-sha256: "e4eb64a5eb8270e8bc62825554438c325566e641c7089e2f3bf564e9184331b9"
            core-sha256: "c68ba56201bd8d99db442b6df599c2c217b0528edec7d6de6e871b6e589c502e"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOONBIT_VERSION }}
          expected-version: ${{ env.MOONBIT_EXPECTED_VERSION }}
          archive-sha256: ${{ matrix.archive-sha256 }}
          core-sha256: ${{ matrix.core-sha256 }}
      - name: Moon check
        run: moon check --deny-warn --warn-list -deprecated_syntax-deprecated --target native 2> >(grep -v 'WARN Duplicate alias' >&2)
      - name: Moon fmt drift guard
        # Run once on the ubuntu leg only — moon fmt is deterministic
        # across platforms, so the second OS would just duplicate the
        # check. Fails if any tracked .mbt file would change.
        if: matrix.os == 'ubuntu-latest'
        run: |
          moon fmt
          if ! git diff --quiet; then
            echo "::error::moon fmt produced changes. Run \`moon fmt\` locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
      - name: Moon native tests
        run: moon test --target native
      - name: CLI smoke test
        run: bash scripts/smoke_cli.sh
      - name: Package contents
        run: moon package --list

  # Umbrella status check so the repo ruleset (which requires the bare
  # name `check-native`) keeps matching once the underlying job moved to
  # a per-OS matrix. Don't remove this without also updating the ruleset.
  check-native:
    name: check-native
    runs-on: ubuntu-latest
    needs: check-native-matrix
    steps:
      - name: All matrix legs succeeded
        run: echo "check-native matrix passed on every os"

  check-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOONBIT_VERSION }}
          expected-version: ${{ env.MOONBIT_EXPECTED_VERSION }}
          archive-sha256: ${{ env.MOONBIT_ARCHIVE_SHA256 }}
          core-sha256: ${{ env.MOONBIT_CORE_SHA256 }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Moon check
        run: moon check --deny-warn --warn-list -deprecated_syntax-deprecated --target js 2> >(grep -v 'WARN Duplicate alias' >&2)
      - name: JS LSP tests
        run: |
          moon build --target js src/lsp
          moon test --target js src/lsp
          moon build --target js src/cmd/vapor_moon_lsp
      - name: LSP launcher smoke test
        run: bash scripts/smoke_lsp.sh
      - name: Runtime JS tests
        run: |
          moon test --target js src/runtime
          moon test --target js src/runtime/context
          moon test --target js src/runtime/dom
          moon test --target js src/runtime/server

  vite-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/vite-plugin-vapor-moon
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  editor-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install VS Code extension dependencies
        run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - name: Validate VS Code extension manifest
        run: |
          node -e "const pkg = require('./package.json'); if (!pkg.contributes?.languages?.length || !pkg.contributes?.grammars?.length) process.exit(1); for (const field of ['repository','bugs','homepage','keywords']) { if (!pkg[field]) { console.error('missing field: '+field); process.exit(1); } }"
        working-directory: editors/vscode
      - name: Verify VS Code extension version tracks moon.mod.json
        run: |
          mod_version="$(grep -m1 '"version"' moon.mod.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          ext_version="$(node -p "require('./editors/vscode/package.json').version")"
          if [ "$mod_version" != "$ext_version" ]; then
            echo "moon.mod.json version $mod_version differs from VS Code extension version $ext_version" >&2
            exit 1
          fi
      - name: Package VS Code extension
        run: npx --yes @vscode/vsce@latest package --no-dependencies --out /tmp/vapor-moon.vsix
        working-directory: editors/vscode
      - name: Check Zed extension
        run: cargo check --locked --manifest-path editors/zed/Cargo.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOONBIT_VERSION }}
          expected-version: ${{ env.MOONBIT_EXPECTED_VERSION }}
          archive-sha256: ${{ env.MOONBIT_ARCHIVE_SHA256 }}
          core-sha256: ${{ env.MOONBIT_CORE_SHA256 }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: e2e
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e
      - name: Run E2E tests
        run: pnpm test
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
