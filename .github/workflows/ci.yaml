name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      update_moonbit_dependencies:
        description: Run moon update before installing dependencies for an intentional registry refresh.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  MOONBIT_VERSION: 0.1.20260512
  NODE_VERSION: "24"
  PNPM_VERSION: "10"
  UPDATE_MOONBIT_DEPENDENCIES: ${{ github.event_name == 'workflow_dispatch' && inputs.update_moonbit_dependencies == true }}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOONBIT_VERSION }}
          update-dependencies: ${{ env.UPDATE_MOONBIT_DEPENDENCIES }}
      - name: Moon check
        run: moon check --deny-warn --warn-list -deprecated_syntax-deprecated --target native 2> >(grep -v 'WARN Duplicate alias' >&2)
      - name: Moon native tests
        run: moon test --target native
      - name: CLI smoke test
        run: bash scripts/smoke_cli.sh
      - name: Package contents
        run: moon package --list

  check-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOONBIT_VERSION }}
          update-dependencies: ${{ env.UPDATE_MOONBIT_DEPENDENCIES }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Moon check
        run: moon check --deny-warn --warn-list -deprecated_syntax-deprecated --target js 2> >(grep -v 'WARN Duplicate alias' >&2)
      - name: JS LSP tests
        run: |
          moon build --target js src/lsp
          moon test --target js src/lsp
          moon build --target js src/cmd/vapor_moon_lsp
      - name: LSP launcher smoke test
        run: bash scripts/smoke_lsp.sh
      - name: Runtime JS tests
        run: |
          moon test --target js src/runtime
          moon test --target js src/runtime/dom
          moon test --target js src/runtime/server

  editor-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install VS Code extension dependencies
        run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - name: Validate VS Code extension manifest
        run: |
          node -e "const pkg = require('./package.json'); if (!pkg.contributes?.languages?.length || !pkg.contributes?.grammars?.length) process.exit(1)"
        working-directory: editors/vscode
      - name: Check Zed extension
        run: cargo check --locked --manifest-path editors/zed/Cargo.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup MoonBit
        uses: ./.github/actions/setup-moonbit
        with:
          version: ${{ env.MOONBIT_VERSION }}
          update-dependencies: ${{ env.UPDATE_MOONBIT_DEPENDENCIES }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: e2e
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: e2e
      - name: Run E2E tests
        run: pnpm test
        working-directory: e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
