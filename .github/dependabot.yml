version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels:
      - codex
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Tokyo
    labels:
      - codex
    groups:
      e2e-node:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    labels:
      - codex
    groups:
      vscode-node:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /editors/zed
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Tokyo
    labels:
      - codex
    groups:
      zed-rust:
        patterns:
          - "*"
